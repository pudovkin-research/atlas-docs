<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 576" width="1000" height="576" role="img" aria-label="ATLAS architecture">
<title>One spine, a list of channels, and the stages that turn the result into an answer</title>
<style>
  .group{fill:#f3f5f8;stroke:#c9d2dd}
  .item,.stage{fill:#ffffff;stroke:#c9d2dd}
  .stage.dim{opacity:.72}
  text{font-family:"Space Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#12253c}
  .kicker{font-size:12px;letter-spacing:.14em;fill:#5b6b80}
  .name{font-size:14px;font-weight:600}
  .sub{font-size:12px;fill:#5b6b80}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11.5px;fill:#5b6b80}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:#5b6b80}
  .tag.on{fill:#d16631} .tag.mid{fill:#0f919c}
  .edge{fill:none;stroke:#c9d2dd;stroke-width:1.5}
  .head{fill:#c9d2dd}
  @media (prefers-color-scheme:dark){
    .group{fill:#141d28;stroke:#2c3a4a}
    .item,.stage{fill:#0f1720;stroke:#2c3a4a}
    text{fill:#e8e4dc}
    .kicker,.sub,.mono,.tag{fill:#9aa7b6}
    .tag.on{fill:#d16631} .tag.mid{fill:#3ab3bd}
    .edge{stroke:#2c3a4a} .head{fill:#2c3a4a}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker></defs>
<rect x="24" y="40" width="330" height="210" rx="8" class="group"/><text x="44" y="68" class="kicker" text-anchor="start">SPINE</text><text x="44" y="88" class="sub" text-anchor="start">one distance scan, one Rust call</text><rect x="44" y="108" width="290" height="36" rx="8" class="item"/><text x="56" y="123" class="name" text-anchor="start">global fit</text><text x="56" y="136" class="mono" text-anchor="start">global_lr · global_linear</text><rect x="44" y="154" width="290" height="36" rx="8" class="item"/><text x="56" y="169" class="name" text-anchor="start">supervised metric</text><text x="56" y="182" class="mono" text-anchor="start">axes scaled by |β| of the global fit</text><rect x="44" y="200" width="290" height="36" rx="8" class="item"/><text x="56" y="215" class="name" text-anchor="start">a ladder of neighbourhood sizes</text><text x="56" y="228" class="mono" text-anchor="start">local_lr@k · vote@k   (nothing selected)</text><rect x="24" y="274" width="330" height="262" rx="8" class="group"/><text x="44" y="302" class="kicker" text-anchor="start">CHANNELS</text><text x="44" y="322" class="sub" text-anchor="start">a list; each one may decline, and says why</text><text x="56" y="347" class="name" text-anchor="start">Additive</text><text x="180" y="347" class="mono" text-anchor="start">additive@5 …</text><text x="334" y="347" class="tag on" text-anchor="end">on</text><text x="56" y="369" class="name" text-anchor="start">Pairwise</text><text x="180" y="369" class="mono" text-anchor="start">pair@4 …</text><text x="334" y="369" class="tag mid" text-anchor="end">regression</text><text x="56" y="391" class="name" text-anchor="start">SingleIndex</text><text x="180" y="391" class="mono" text-anchor="start">index@1 …</text><text x="334" y="391" class="tag mid" text-anchor="end">regression</text><text x="56" y="413" class="name" text-anchor="start">SparseAdditive</text><text x="180" y="413" class="mono" text-anchor="start">sparse@40 …</text><text x="334" y="413" class="tag" text-anchor="end">off</text><text x="56" y="435" class="name" text-anchor="start">Surface</text><text x="180" y="435" class="mono" text-anchor="start">surf@2 …</text><text x="334" y="435" class="tag" text-anchor="end">off</text><text x="56" y="457" class="name" text-anchor="start">RobustLocal</text><text x="180" y="457" class="mono" text-anchor="start">huber@40 …</text><text x="334" y="457" class="tag" text-anchor="end">off</text><text x="56" y="479" class="name" text-anchor="start">TemporalScale</text><text x="180" y="479" class="mono" text-anchor="start">scale@6 …</text><text x="334" y="479" class="tag mid" text-anchor="end">ordered</text><text x="56" y="501" class="name" text-anchor="start">Reservoir</text><text x="180" y="501" class="mono" text-anchor="start">esn@0.01 …</text><text x="334" y="501" class="tag mid" text-anchor="end">ordered</text><text x="56" y="523" class="name" text-anchor="start">Gradient</text><text x="180" y="523" class="mono" text-anchor="start">grad@r2 …</text><text x="334" y="523" class="tag" text-anchor="end">off</text><rect x="470" y="60" width="300" height="92" rx="8" class="stage"/><text x="490" y="90" class="kicker" text-anchor="start">EXPERT MATRIX</text><text x="490" y="112" class="name" text-anchor="start">one column per member</text><text x="490" y="132" class="mono" text-anchor="start">(n, n_experts)</text><path d="M620 152 V174" class="edge" marker-end="url(#a)"/><rect x="470" y="182" width="300" height="92" rx="8" class="stage"/><text x="490" y="212" class="kicker" text-anchor="start">STACK</text><text x="490" y="234" class="name" text-anchor="start">what a row may have seen</text><text x="490" y="254" class="mono" text-anchor="start">auto · cv · blocked</text><path d="M620 274 V296" class="edge" marker-end="url(#a)"/><rect x="470" y="304" width="300" height="92" rx="8" class="stage"/><text x="490" y="334" class="kicker" text-anchor="start">COMBINER</text><text x="490" y="356" class="name" text-anchor="start">strictly convex, one optimum</text><text x="490" y="376" class="mono" text-anchor="start">nothing is searched</text><path d="M620 396 V418" class="edge" marker-end="url(#a)"/><rect x="470" y="426" width="300" height="92" rx="8" class="stage dim"/><text x="490" y="456" class="kicker" text-anchor="start">DECISION</text><text x="490" y="478" class="name" text-anchor="start">a probability becomes a label</text><text x="490" y="498" class="mono" text-anchor="start">classifier only</text><path d="M354 145 H418" class="edge"/><path d="M354 405 H418" class="edge"/><path d="M418 106 V405" class="edge"/><path d="M418 106 H462" class="edge" marker-end="url(#a)"/></svg>
